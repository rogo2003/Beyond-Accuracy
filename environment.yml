name: beyond-accuracy
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - cudatoolkit=11.8          # omit or change if running CPU-only
  - pip:
    - torch>=2.1.0
    - torchvision>=0.16.0
    - timm>=0.9.12
    - numpy>=1.24.0
    - scipy>=1.11.0
    - pandas>=2.0.0
    - scikit-learn>=1.3.0
    - opencv-python>=4.8.0
    - shap>=0.43.0
    - statsmodels>=0.14.0
    - matplotlib>=3.7.0
    - seaborn>=0.12.0
    - thop>=0.1.1
    - jupyter>=1.0.0
    - tqdm>=4.66.0
    - ipykernel
